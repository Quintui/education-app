<style>
  .pg { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .pg p { margin: 0; color: var(--muted); }
  .pg label { display: flex; gap: 12px; align-items: center; font-weight: 600; }
  .pg input { flex: 1; accent-color: var(--primary); }
  .pg svg { width: 100%; height: 360px; background: var(--surface); border-radius: 16px; }
</style>
<div class="pg">
  <p>Make the mass heavier and watch how much the light bends.</p>
  <label>Mass <input id="mass" type="range" min="0" max="100" value="35" /> <span id="value">35</span></label>
  <svg viewBox="0 0 800 360">
    <circle id="body" cx="400" cy="180" r="30" fill="var(--accent)" />
    <path id="ray" fill="none" stroke="var(--primary)" stroke-width="5" stroke-linecap="round" />
  </svg>
</div>
<script>
  const mass = document.getElementById("mass");
  const render = () => {
    const m = Number(mass.value);
    document.getElementById("value").textContent = m;
    document.getElementById("body").setAttribute("r", 14 + m * 0.5);
    const bend = m * 1.2;
    document.getElementById("ray").setAttribute("d", `M 0 80 C 300 80, 320 ${80 + bend}, 400 ${80 + bend * 0.9} S 560 ${80 + bend * 1.4}, 800 ${80 + bend * 2.2}`);
  };
  mass.addEventListener("input", render);
  render();
</script>
